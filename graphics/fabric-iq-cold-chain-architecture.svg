<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Fabric IQ cold-chain architecture</title>
  <desc id="description">Business and sensor data flows through a semantic model, ontology, graph, data and operations agents, planning, and governed actions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #172b3a; }
      .subtitle { font: 400 18px 'Segoe UI', sans-serif; fill: #52616f; }
      .stage { font: 700 14px 'Segoe UI', sans-serif; letter-spacing: 1px; fill: #52616f; }
      .box-title { font: 700 21px 'Segoe UI', sans-serif; fill: #172b3a; }
      .box-copy { font: 400 15px 'Segoe UI', sans-serif; fill: #405261; }
      .small-title { font: 700 17px 'Segoe UI', sans-serif; fill: #172b3a; }
      .small-copy { font: 400 13px 'Segoe UI', sans-serif; fill: #405261; }
      .flow { fill: none; stroke: #52616f; stroke-width: 3; marker-end: url(#arrow); }
      .context-flow { fill: none; stroke: #7b8791; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f9fa"/>
  <text x="70" y="70" class="title">Cold-chain intelligence with Fabric IQ</text>
  <text x="70" y="104" class="subtitle">From governed enterprise and real-time data to coordinated decisions and actions</text>

  <text x="70" y="160" class="stage">DATA</text>
  <text x="295" y="160" class="stage">MEANING</text>
  <text x="525" y="160" class="stage">RELATIONSHIPS</text>
  <text x="755" y="160" class="stage">INSIGHTS</text>
  <text x="1040" y="160" class="stage">DECISIONS</text>
  <text x="1240" y="160" class="stage">ACTIONS</text>

  <rect x="70" y="190" width="190" height="150" rx="8" fill="#dff3f0" stroke="#118d7e" stroke-width="2"/>
  <text x="95" y="225" class="box-title">Semantic Model</text>
  <text x="95" y="257" class="box-copy">Trusted metrics</text>
  <text x="95" y="282" class="box-copy">Delivery performance</text>
  <text x="95" y="307" class="box-copy">SLA attainment</text>

  <rect x="295" y="190" width="190" height="150" rx="8" fill="#e8eef9" stroke="#4169a1" stroke-width="2"/>
  <text x="320" y="225" class="box-title">Ontology</text>
  <text x="320" y="257" class="box-copy">Shipment</text>
  <text x="320" y="282" class="box-copy">Route and facility</text>
  <text x="320" y="307" class="box-copy">Sensor and customer</text>

  <rect x="520" y="190" width="190" height="150" rx="8" fill="#f7ead8" stroke="#b66a16" stroke-width="2"/>
  <text x="545" y="225" class="box-title">Graph</text>
  <text x="545" y="257" class="box-copy">Connected entities</text>
  <text x="545" y="282" class="box-copy">Dependencies</text>
  <text x="545" y="307" class="box-copy">Impact paths</text>

  <rect x="750" y="190" width="230" height="150" rx="8" fill="#f1e8f5" stroke="#7d4e8d" stroke-width="2"/>
  <text x="775" y="225" class="box-title">Data Agent</text>
  <text x="775" y="257" class="box-copy">Conversational analysis</text>
  <text x="775" y="282" class="box-copy">Customer impact</text>
  <text x="775" y="307" class="box-copy">Grounded answers</text>

  <rect x="750" y="390" width="230" height="150" rx="8" fill="#fde7e3" stroke="#c84b40" stroke-width="2"/>
  <text x="775" y="425" class="box-title">Operations Agent</text>
  <text x="775" y="457" class="box-copy">Continuous monitoring</text>
  <text x="775" y="482" class="box-copy">Anomaly detection</text>
  <text x="775" y="507" class="box-copy">Recommended response</text>

  <rect x="1030" y="290" width="170" height="150" rx="8" fill="#fff4cc" stroke="#a97c00" stroke-width="2"/>
  <text x="1055" y="325" class="box-title">Plan</text>
  <text x="1055" y="357" class="box-copy">Forecasts</text>
  <text x="1055" y="382" class="box-copy">Assumptions</text>
  <text x="1055" y="407" class="box-copy">Coordinated decisions</text>

  <rect x="1240" y="290" width="120" height="150" rx="8" fill="#e3f2df" stroke="#4b8c3f" stroke-width="2"/>
  <text x="1265" y="325" class="box-title">Act</text>
  <text x="1265" y="357" class="box-copy">Alert</text>
  <text x="1265" y="382" class="box-copy">Reroute</text>
  <text x="1265" y="407" class="box-copy">Adjust</text>

  <path d="M260 265 H295" class="flow"/>
  <path d="M485 265 H520" class="flow"/>
  <path d="M710 265 H750" class="flow"/>
  <path d="M980 265 C1010 265 1000 330 1030 330" class="flow"/>
  <path d="M980 465 C1010 465 1000 400 1030 400" class="flow"/>
  <path d="M1200 365 H1240" class="flow"/>

  <rect x="70" y="430" width="250" height="110" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
  <text x="95" y="465" class="small-title">Live sensor telemetry</text>
  <text x="95" y="493" class="small-copy">Temperature and location</text>
  <text x="95" y="516" class="small-copy">Shipment events</text>
  <path d="M320 485 H750" class="flow"/>
  <path d="M615 340 V390 H750" class="context-flow"/>

  <rect x="70" y="620" width="1290" height="80" rx="8" fill="#172b3a"/>
  <text x="700" y="655" text-anchor="middle" style="font: 700 18px 'Segoe UI', sans-serif; fill: #ffffff;">Shared business context keeps analytics, agents, planning, and action aligned</text>
  <text x="700" y="681" text-anchor="middle" style="font: 400 15px 'Segoe UI', sans-serif; fill: #dbe5eb;">Data → Meaning → Relationships → Insights → Decisions → Actions</text>
</svg>