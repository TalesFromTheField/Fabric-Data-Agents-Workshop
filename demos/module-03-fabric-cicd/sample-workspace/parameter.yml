# =============================================================================
# parameter.yml - environment-specific value replacement for fabric-cicd
#
# This file is the entire point of the demo.
#
# The data agent in this folder records the GUID of every data source it is
# attached to, in each datasource.json. Those GUIDs are correct in the
# development workspace and wrong everywhere else. Deploy without this file and
# the agent lands in production still pointed at development data - it does not
# error, it just answers from the wrong environment.
#
# fabric-cicd applies these replacements in memory at deploy time. The files on
# disk are never modified.
#
# $workspace.$id           -> ID of the workspace being deployed into
# $items.<Type>.<Name>.$id -> ID of that item after it lands in the target
#
# Because the right-hand side resolves at deploy time, this file contains no
# target-specific GUIDs and keeps working as you add environments.
#
# Docs: https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/
# =============================================================================

find_replace:
    # The warehouse the agent queries for sales questions.
    - find_value: "22222222-2222-2222-2222-222222222222"
      replace_value:
          TEST: "$items.Warehouse.ContosoSales.$id"
          PROD: "$items.Warehouse.ContosoSales.$id"
      item_type: "DataAgent"

    # The lakehouse the agent queries for market research questions.
    - find_value: "33333333-3333-3333-3333-333333333333"
      replace_value:
          TEST: "$items.Lakehouse.MarketResearch.$id"
          PROD: "$items.Lakehouse.MarketResearch.$id"
      item_type: "DataAgent"

    # The workspace ID recorded alongside each data source reference.
    - find_value: "11111111-1111-1111-1111-111111111111"
      replace_value:
          TEST: "$workspace.$id"
          PROD: "$workspace.$id"
      item_type: "DataAgent"
