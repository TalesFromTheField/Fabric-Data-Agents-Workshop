# =============================================================================
# Azure DevOps Pipelines - deploy Fabric items with fabric-cicd
#
# Runs `deploy.py`, which calls the fabric-cicd Python library. Target
# workspaces, item types, and the parameter file all come from config.yml, so
# this pipeline stays thin.
#
# In a real setup, point config.yml's repository_directory at the folder that
# Fabric Git integration commits, rather than the bundled sample-workspace.
#
# One-time setup:
#   1. Create an ARM service connection in Project Settings > Service
#      connections, and set its name in the `serviceConnection` variable.
#   2. Grant that identity Contributor or Admin on the target Fabric workspaces.
#   3. Enable the Fabric tenant setting "Service principals can use Fabric APIs".
#   4. Create Environments named TEST and PROD to attach approval gates.
#
# The AzureCLI@2 task establishes an `az login` session, which
# AzureCliCredential then picks up - no secrets are handled in the script.
#
# Alternative: the Azure DevOps Pipelines extension for Fabric provides native
# tasks that run Fabric CLI commands, which shell out to fabric-cicd. See
# ../fabric-cli/ for that style of deployment.
# =============================================================================

trigger:
  branches:
    include: [main]
  paths:
    include:
      - demos/module-03-fabric-cicd/*

pool:
  vmImage: ubuntu-latest

variables:
  # fabric-cicd advertises 3.9 support but does not import on it.
  pythonVersion: "3.12"
  serviceConnection: "fabric-deployment"
  demoDirectory: "demos/module-03-fabric-cicd"

stages:
  - stage: TEST
    displayName: Deploy to TEST
    jobs:
      - deployment: deploy_test
        environment: TEST
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: $(pythonVersion)

                - script: pip install -r requirements.txt
                  workingDirectory: $(demoDirectory)
                  displayName: Install fabric-cicd

                - task: AzureCLI@2
                  displayName: Inspect (no API calls)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(demoDirectory)
                    inlineScript: python deploy.py inspect --environment TEST

                - task: AzureCLI@2
                  displayName: Deploy to Fabric (TEST)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(demoDirectory)
                    inlineScript: python deploy.py deploy --environment TEST

  - stage: PROD
    displayName: Deploy to PROD
    dependsOn: TEST
    condition: succeeded()
    jobs:
      - deployment: deploy_prod
        # Attach approvals and checks to this Environment in the Azure DevOps UI.
        environment: PROD
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: $(pythonVersion)

                - script: pip install -r requirements.txt
                  workingDirectory: $(demoDirectory)
                  displayName: Install fabric-cicd

                - task: AzureCLI@2
                  displayName: Deploy to Fabric (PROD)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(demoDirectory)
                    inlineScript: python deploy.py deploy --environment PROD
