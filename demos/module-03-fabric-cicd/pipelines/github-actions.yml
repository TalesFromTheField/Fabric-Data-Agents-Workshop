# =============================================================================
# GitHub Actions - deploy Fabric items with fabric-cicd
#
# Runs `deploy.py`, which calls the fabric-cicd Python library. Target
# workspaces, item types, and the parameter file all come from config.yml, so
# this workflow stays thin.
#
# In a real setup, point config.yml's repository_directory at the folder that
# Fabric Git integration commits, rather than the bundled sample-workspace.
#
# One-time setup:
#   1. Register an Entra app and grant it Contributor or Admin on the target
#      Fabric workspaces.
#   2. Configure federated credentials for OIDC (no client secret needed):
#      https://learn.microsoft.com/entra/workload-id/workload-identity-federation
#   3. Add repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID.
#   4. Enable the Fabric tenant setting "Service principals can use Fabric APIs".
#
# Reminder: Fabric data agents support service principals for ALM only. A
# service principal can deploy an agent; it cannot query one.
# =============================================================================

name: Deploy Fabric items

on:
  push:
    branches: [main]
    paths:
      - "demos/module-03-fabric-cicd/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match a key in config.yml)
        type: choice
        options: [TEST, PROD]
        default: TEST

permissions:
  id-token: write # required for OIDC login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'TEST' }}
    defaults:
      run:
        working-directory: demos/module-03-fabric-cicd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # fabric-cicd advertises 3.9 support but does not import on it.
          python-version: "3.12"

      - name: Install fabric-cicd
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Prints the items and the replacement rules without calling any API.
      # Cheap, and it makes the log useful when a deployment surprises you.
      - name: Inspect
        run: python deploy.py inspect --environment "${{ inputs.environment || 'TEST' }}"

      - name: Deploy to Fabric
        run: |
          python deploy.py deploy \
            --environment "${{ inputs.environment || 'TEST' }}" \
            ${{ runner.debug == '1' && '--debug' || '' }}
