# =============================================================================
# parameter.example.yml
#
# Reference copy of the file fabric-cicd uses to make one set of source files
# deploy correctly into many environments. The `scan` stage of
# fabric_cicd_demo.py generates a real one for you at workspace/parameter.yml;
# this file exists to explain what it is doing and to show the options the
# generator does not use.
#
# Rules that matter:
#   * The file must sit in the ROOT of your `repository_directory`.
#   * Environment keys (PPE / PROD / anything) must match the `environment`
#     value passed to FabricWorkspace. No match means no replacement happens
#     and the deployment silently keeps its dev values.
#   * Replacement happens in memory at deploy time. Your source files on disk
#     are never modified.
#
# Docs: https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/
# =============================================================================

find_replace:
    # -------------------------------------------------------------------------
    # 1. The pattern the demo generates: re-point a data agent's data source.
    #
    # A Fabric data agent stores the GUID of every data source it is attached
    # to. Deployed as-is into another workspace, the agent keeps answering
    # questions from the DEV lakehouse - which usually still works, which is
    # exactly why this bug survives to production.
    #
    # `$items.<Type>.<Name>.$id` resolves to that item's GUID *in the workspace
    # being deployed into*, after it has been created there.
    # -------------------------------------------------------------------------
    - find_value: "11111111-1111-1111-1111-111111111111" # DEV lakehouse GUID
      replace_value:
          PPE: "$items.Lakehouse.Cold Chain LH.$id"
          PROD: "$items.Lakehouse.Cold Chain LH.$id"
      item_type: "DataAgent"

    # -------------------------------------------------------------------------
    # 2. The workspace ID the agent recorded alongside the data source.
    # -------------------------------------------------------------------------
    - find_value: "22222222-2222-2222-2222-222222222222" # DEV workspace GUID
      replace_value:
          PPE: "$workspace.$id"
          PROD: "$workspace.$id"
      item_type: ["DataAgent", "Notebook"]

    # -------------------------------------------------------------------------
    # 3. Static values - connections, endpoints, anything not source controlled.
    #
    # Connections are NOT stored in Git. They must already exist in the target
    # workspace, and the identity running the deployment must have access to
    # them or the deployment fails.
    # -------------------------------------------------------------------------
    - find_value: "33333333-3333-3333-3333-333333333333" # DEV connection GUID
      replace_value:
          PPE: "44444444-4444-4444-4444-444444444444"
          PROD: "55555555-5555-5555-5555-555555555555"

    # -------------------------------------------------------------------------
    # 4. Regex form - when you cannot know the DEV value ahead of time.
    #
    # Capture group 1 is the part that gets replaced, so include surrounding
    # context and capture only the value. Matching a bare GUID pattern would
    # rewrite every GUID in the file.
    #
    # `is_regex` cannot be combined with a $variable in `find_value`, but the
    # `replace_value` may still use one.
    # -------------------------------------------------------------------------
    - find_value: '\#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F-]{36})"'
      is_regex: "true"
      replace_value:
          PPE: "$items.Lakehouse.Cold Chain LH.$id"
          PROD: "$items.Lakehouse.Cold Chain LH.$id"
      item_type: "Notebook"
      item_name: ["Load Cold Chain"]

# =============================================================================
# key_value_replace - target a specific JSON/YAML key instead of a raw string.
# Safer than find_replace when the same GUID legitimately appears more than once
# and you only want to change one of them.
# =============================================================================
key_value_replace:
    - find_key: $.properties.activities[?(@.name=="Refresh Agent")].typeProperties.workspaceId
      replace_value:
          PPE: "$workspace.$id"
          PROD: "$workspace.$id"
      item_type: "DataPipeline"

# =============================================================================
# spark_pool - custom Spark pool IDs are workspace-specific. Without this,
# environments silently fall back to the default starter pool.
# =============================================================================
# spark_pool:
#     - instance_pool_id: "66666666-6666-6666-6666-666666666666"
#       replace_value:
#           PPE:
#               type: "Capacity"
#               name: "ppe-pool"
#           PROD:
#               type: "Capacity"
#               name: "prod-pool"
